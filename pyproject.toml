[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "repo-atlas"
version = "1.0.0"
description = "A persistent structural codebase index exposed over MCP"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "RepoAtlas contributors" }]
dependencies = [
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]
mcp = ["mcp>=1.2,<2"]
docs = ["mkdocs-material>=9.5,<10"]

[project.scripts]
ratlas = "repo_atlas.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unused_ignores = true